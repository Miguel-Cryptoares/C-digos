<!DOCTYPE html>
<html lang="pt-br" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Gerenciamento de Eventos</title>
    <link rel="icon" href="https://upload.wikimedia.org/wikipedia/commons/thumb/2/26/Bras%C3%A3o_do_Rio_Grande_do_Norte.svg/1280px-Bras%C3%A3o_do_Rio_Grande_do_Norte.svg.png">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f8fafc',
                            100: '#f1f5f9',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            800: '#1e293b',
                            900: '#0f172a',
                        },
                        redBrand: {
                            50: '#fff1f2',
                            100: '#ffe4e6',
                            400: '#fb7185',
                            500: '#f43f5e',
                            600: '#e11d48',
                            700: '#be123c',
                            900: '#881337',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen flex items-center justify-center p-4">

    <!-- Container Principal a Panna 2 a Paset (Split Screen Moderno) -->
    <div class="w-full max-w-5xl bg-slate-900 border border-slate-800 rounded-3xl shadow-2xl overflow-hidden grid grid-cols-1 lg:grid-cols-2">
        
        <!-- Paset a Kannigid (Lado Esquerdo - Branding / Logo) -->
        <div class="relative hidden lg:flex flex-col items-center justify-center bg-slate-950 p-12 border-r border-slate-800">
            <div class="absolute -left-10 -top-10 w-60 h-60 bg-redBrand-500/10 rounded-full blur-3xl pointer-events-none"></div>
            
            <div class="relative z-10 text-center space-y-4">
                <div class="w-20 h-20 mx-auto rounded-2xl bg-slate-900 border border-slate-700 flex items-center justify-center text-4xl shadow-xl">
                    🎓
                </div>
                <div>
                    <div class="flex items-center justify-center gap-2">
                        <span class="text-2xl font-extrabold text-white tracking-tight">SGEE</span>
                    </div>
                    <p class="text-xs text-slate-400 mt-2 max-w-xs mx-auto">Sistema de Gerenciamento de Eventos Escolares</p>
                </div>
            </div>
        </div>

        <!-- Paset a Kannawan (Lado Direito - Formulário de Login) -->
        <div class="p-8 sm:p-12 flex flex-col justify-center">
            
            <!-- Mobile Logo Header (Visible only on small screens) -->
            <div class="lg:hidden flex items-center space-x-3 mb-8">
                <div class="w-10 h-10 rounded-xl bg-slate-800 flex items-center justify-center text-white font-bold text-xl border border-slate-700">
                    🎓
                </div>
                <div>
                    <span class="text-lg font-extrabold text-white">SGEE</span>
                </div>
            </div>

            <div class="mb-6">
                <h1 class="text-2xl font-bold text-white tracking-tight">Iniciar Sessão</h1>
                <p class="text-xs text-slate-400 mt-1">Olá, Digite seu CPF e senha para poder continuar para a próxima página</p>
            </div>

            <form id="formLogin" onsubmit="return realizarLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5" for="cpf">CPF</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-500">
                            <i class="fa-solid fa-id-card text-sm"></i>
                        </span>
                        <input
                            type="text"
                            id="cpf"
                            name="cpf"
                            placeholder="000.000.000-00"
                            maxlength="14"
                            required
                            class="w-full pl-10 pr-4 py-2.5 text-sm bg-slate-950 border border-slate-800 rounded-xl text-slate-200 placeholder-slate-600 focus:bg-slate-900 focus:border-redBrand-500 focus:outline-none focus:ring-2 focus:ring-redBrand-500/20 transition duration-200">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5" for="senha">Senha</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-500">
                            <i class="fa-solid fa-lock text-sm"></i>
                        </span>
                        <input
                            type="password"
                            id="senha"
                            name="senha"
                            placeholder="••••••••"
                            required
                            class="w-full pl-10 pr-4 py-2.5 text-sm bg-slate-950 border border-slate-800 rounded-xl text-slate-200 placeholder-slate-600 focus:bg-slate-900 focus:border-redBrand-500 focus:outline-none focus:ring-2 focus:ring-redBrand-500/20 transition duration-200">
                    </div>
                </div>

                <button type="submit" class="w-full py-3 bg-redBrand-600 hover:bg-redBrand-700 text-white font-semibold text-xs tracking-wider uppercase rounded-xl shadow-lg shadow-redBrand-950/50 transition transform active:scale-95 duration-150 border border-redBrand-500/30 flex items-center justify-center gap-2 mt-2">
                    <i class="fa-solid fa-right-to-bracket"></i>
                    <span>ENTRAR</span>
                </button>

                <button
                    type="button"
                    class="w-full py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold text-xs tracking-wider uppercase rounded-xl transition duration-150 border border-slate-700 flex items-center justify-center gap-2"
                    onclick="window.location.href='Cadastro.html'">
                    <i class="fa-solid fa-user-plus text-redBrand-400"></i>
                    <span>CRIAR CONTA</span>
                </button>

               <!-- Mensagem de feedback (Erro ou Sucesso) -->
               <div id="mensagem" class="hidden text-sm font-medium p-4.5 rounded-xl text-center transition-all duration-300 mt-3 flex items-center justify-center gap-2 border"></div>
            </form>
        </div>

    </div>
    
    <script src="./JS/index.js"></script>
</body>
</html>
