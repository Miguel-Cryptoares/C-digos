<!DOCTYPE html>
<html lang="pt-br" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - SGEE Gerenciamento de Eventos</title>
    <link rel="icon" href="https://upload.wikimedia.org/wikipedia/commons/thumb/2/26/Bras%C3%A3o_do_Rio_Grande_do_Norte.svg/1280px-Bras%C3%A3o_do_Rio_Grande_do_Norte.svg.png">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./CSS/Cadastro.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        redBrand: {
                            400: '#fb7185',
                            500: '#f43f5e',
                            600: '#e11d48',
                            700: '#be123c',
                        }
                    }
                }
            }
        }
    </script>

</head>
<body class="flex min-h-screen relative overflow-x-hidden">

    <!-- Luz Glow de Fundo -->
    <div class="glow-bg"></div>

    <!-- Container Principal (Split Screen) -->
    <div class="flex w-full min-h-screen z-10">

        <!-- Painel Esquerdo com Logo e Apresentação -->
        <div class="hidden md:flex md:w-5/12 lg:w-1/2 bg-slate-900/50 backdrop-blur-md flex-col items-center justify-center p-12 border-r border-white/5 relative">
            <div class="max-w-md text-center space-y-6">
                <div class="relative inline-block">
                    <img class="w-56 h-auto mx-auto object-contain drop-shadow-[0_15px_25px_rgba(0,0,0,0.6)] transition-transform duration-300 hover:scale-105" 
                         src="./IMG/logo3.png" 
                         alt="Logo SGEE">
                </div>
                
                <div class="space-y-3">
                    <span class="inline-block px-3 py-1 bg-red-500/10 text-red-400 border border-red-500/20 rounded-full text-xs font-semibold tracking-wide uppercase">
                        Sistema Escolar
                    </span>
                    <h2 class="text-3xl font-extrabold text-white tracking-tight">SGEE · Registro</h2>
                    <p class="text-sm text-slate-400 leading-relaxed max-w-sm mx-auto">
                        Crie sua conta de Professor ou Coordenador para gerenciar e acompanhar os eventos escolares de forma simples e eficiente.
                    </p>
                </div>
            </div>
        </div>

        <!-- Painel Direito com Formulário -->
        <div class="w-full md:w-7/12 lg:w-1/2 flex items-center justify-center p-6 sm:p-10 my-auto">
            <div class="cadastro-card w-full max-w-md p-8 rounded-3xl">
                
                <div class="mb-6">
                    <h1 class="text-2xl font-extrabold text-white tracking-tight">CRIAR CONTA</h1>
                    <p class="text-xs text-slate-400 mt-1">Preencha os dados abaixo para se registrar no sistema.</p>
                </div>

                <form id="formCadastro" onsubmit="return cadastrar(event)" class="space-y-4">
                    
                    <!-- Campo: Nome Completo -->
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1.5" for="nome">Nome Completo</label>
                        <div class="input-group">
                            <i class="fa-solid fa-user input-icon text-xs"></i>
                            <input class="custom-input" type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>
                        </div>
                    </div>

                    <!-- Campo: CPF -->
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1.5" for="cpf">CPF</label>
                        <div class="input-group">
                            <i class="fa-solid fa-id-card input-icon text-xs"></i>
                            <input class="custom-input" type="text" id="cpf" name="cpf" placeholder="000.000.000-00" maxlength="14" oninput="aplicarMascaraCPF(this)" required>
                        </div>
                    </div>

                    <!-- Campo: Tipo de Utilizador -->
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1.5" for="tipo">Tipo</label>
                        <div class="input-group">
                            <i class="fa-solid fa-user-gear input-icon text-xs"></i>
                            <select class="custom-input" id="tipo" name="tipo" required>
                                <option value="" disabled selected>Selecione o tipo de usuário</option>
                                <option value="professor">Professor</option>
                                <option value="coordenador">Coordenador</option>
                            </select>
                            <i class="fa-solid fa-chevron-down absolute right-4 top-1/2 -translate-y-1/2 text-xs text-slate-500 pointer-events-none"></i>
                        </div>
                    </div>

                    <!-- Campo: Palavra-passe -->
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1.5" for="senha">Senha</label>
                        <div class="input-group">
                            <i class="fa-solid fa-lock input-icon text-xs"></i>
                            <input class="custom-input" type="password" id="senha" name="senha" placeholder="••••••••" required>
                            <i class="fa-solid fa-eye toggle-password text-xs" onclick="toggleSenha('senha', this)"></i>
                        </div>
                    </div>

                    <!-- Campo: Confirmar Palavra-passe -->
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1.5" for="confirmarSenha">Confirmar Senha</label>
                        <div class="input-group">
                            <i class="fa-solid fa-shield-halved input-icon text-xs"></i>
                            <input class="custom-input" type="password" id="confirmarSenha" placeholder="••••••••" required>
                            <i class="fa-solid fa-eye toggle-password text-xs" onclick="toggleSenha('confirmarSenha', this)"></i>
                        </div>
                    </div>

                    <!-- Botão Cadastrar -->
                    <button type="submit" class="btn-submit w-full py-3.5 mt-2 text-white font-bold text-xs tracking-wider uppercase rounded-xl">
                        Cadastrar
                    </button>

                    <!-- Botão Voltar -->
                    <button type="button" class="btn-voltar w-full py-3 text-slate-300 font-semibold text-xs tracking-wider uppercase rounded-xl" onclick="window.location.href='index.html'">
                        Voltar ao Login
                    </button>

                    <!-- Mensagem de Feedback -->
                    <p id="mensagem" class="mt-3 font-semibold text-redBrand-400 text-xs text-center min-h-[1.25rem]"></p>
                </form>

            </div>
        </div>
    </div>
    <script src="./JS/Cadastro.js"></script>
</body>
</html>
